<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f9d58" />
    <meta
      name="description"
      content="MarketMint - track live cryptocurrency prices, market data and your personal watchlist."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>MarketMint</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #475569;"
      >
        Loading MarketMint&hellip;
      </div>
    </div>
    <script>
      // Fallback so the page never stays silently blank if the bundle fails to load.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root) {
            var text = root.textContent || '';
            if (text.indexOf('Loading MarketMint') !== -1) {
              root.innerHTML =
                '<div style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center; color: #b91c1c;">' +
                '<h1 style="font-size: 1.25rem;">MarketMint could not start</h1>' +
                '<p>The application bundle failed to load. Please check your connection and refresh the page.</p>' +
                '</div>';
            }
          }
        }, 10000);
      });
    </script>
  </body>
</html>
